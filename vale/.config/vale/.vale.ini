# Global vale config (used when a project has no .vale.ini of its own).
# After changing `Packages`, run `vale sync` to download them into StylesPath
# (default: ~/.local/share/vale/styles, see `vale ls-dirs`).
# See https://vale.sh/docs/vale-ini

# Only report suggestions and above (`suggestion`, `warning`, `error`)
MinAlertLevel = suggestion

Packages = proselint

# Vale: built-in style (spelling, repeated words, ...)
[*.{md,txt}]
BasedOnStyles = Vale, proselint

# Neovim's spellcheck already covers this (and learns words via `zg`);
# vale's flags every tool/command name in technical notes
Vale.Spelling = NO
